name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:  # Nightly build
    - cron: "30 0 * * *"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install pcap
      run: |
        sudo apt update
        sudo apt install libpcap-dev

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ipxbox.go

    - name: Test
      run: |
        go test -cover \
            $PWD/ipx            \
            $PWD/network/doom   \
            $PWD/network/pipe   \
            $PWD/network/filter

  crosscompile:
    strategy:
      matrix:
        goarch: [386, amd64, arm64]
        goos: [darwin, freebsd, linux, windows]
        exclude:
        - goarch: 386
          goos: darwin

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        mkdir artifacts
        cd artifacts
        go build -v ../standalone/ipxbox_minimal.go
        go build -tags nopcap -v ../ipxbox.go
        go build -tags nopcap -v ../standalone/ipxbox_uplink.go
        go build -tags nopcap -v ../standalone/standalone_ipxpkt.go
        go build -tags nopcap -v ../standalone/standalone_pptp.go
        go build -tags nopcap -v ../standalone/standalone_qproxy.go
      env:
        GOARCH: ${{ matrix.goarch }}
        GOOS: ${{ matrix.goos }}

    # We package the artifacts in a .tar to preserve permissions.
    - name: Tar artifacts
      run: |
        tar -C artifacts -czf artifacts.tar.gz .
      if: ${{ matrix.goos != 'windows' }}

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        path: "artifacts.tar.gz"
        name: ipxbox_${{ matrix.goos }}_${{ matrix.goarch }}
        archive: false

